<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0B1020" />
    <title>Offline - TONBANKCARD Crypto Tracker</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #0b1020;
            --panel: #121a2b;
            --text: #f5f9ff;
            --muted: #a8b8cc;
            --accent: #1bb2da;
            --border: #263a5d;
        }
        * {
            box-sizing: border-box;
        }
        html,
        body {
            min-height: 100%;
            margin: 0;
        }
        body {
            display: grid;
            place-items: center;
            padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
            background: var(--bg);
            color: var(--text);
            font-family: Roboto, Arial, sans-serif;
        }
        main {
            width: min(100%, 420px);
            padding: 24px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--panel);
        }
        .mark {
            width: 44px;
            height: 44px;
            margin-bottom: 20px;
        }
        h1 {
            margin: 0 0 10px;
            font-size: 1.4rem;
            line-height: 1.25;
            letter-spacing: 0;
        }
        p {
            margin: 0;
            color: var(--muted);
            line-height: 1.5;
        }
        a {
            display: inline-flex;
            margin-top: 20px;
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>
<main>
    <svg class="mark" viewBox="0 0 128 128" role="img" aria-label="TONBANKCARD">
        <rect width="128" height="128" rx="24" fill="#0b1020"></rect>
        <path d="M24 29h80L64 100 24 29z" fill="#1bb2da"></path>
        <path d="M40 41h48L64 84 40 41z" fill="#f6fafd"></path>
        <path d="M64 84 51 41h26L64 84z" fill="#1bb2da"></path>
    </svg>
    <h1>TONBANKCARD Crypto Tracker is offline</h1>
    <p>The app shell is available, but live market data needs a network connection. Reconnect and reload to continue.</p>
    <a href="/">Try again</a>
</main>
</body>
</html>
