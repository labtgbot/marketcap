<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">TONBANKCARD icon</title>
  <desc id="desc">TONBANKCARD Crypto Tracker gem icon.</desc>

  <!-- Black outer circle -->
  <circle cx="64" cy="64" r="64" fill="#111111"/>
  <!-- Cyan/blue inner circle background -->
  <circle cx="64" cy="64" r="52" fill="#29abe2"/>

  <!--
    Diamond gem: round brilliant cut
    Crown top y=26, girdle y=62, culet y=100, center x=63
    Width at girdle: 82 (x=22 to x=104)
  -->

  <!-- === PAVILION (draw first, behind crown) === -->
  <polygon points="22,62 37,62 63,100" fill="#a050c8"/>
  <polygon points="37,62 52,62 63,100" fill="#8838b0"/>
  <polygon points="52,62 74,62 63,100" fill="#6e28a0"/>
  <polygon points="74,62 89,62 63,100" fill="#581890"/>
  <polygon points="89,62 104,62 63,100" fill="#440c7a"/>

  <!-- === CROWN BEZEL & STAR FACETS === -->
  <!-- Far left bezel -->
  <polygon points="22,62 37,62 34,42 22,52" fill="#c888e8"/>
  <!-- Left bezel -->
  <polygon points="34,42 37,62 50,62 48,42" fill="#d8a8f4"/>
  <!-- Center-left upper -->
  <polygon points="48,42 50,62 63,52" fill="#e8c8ff"/>
  <!-- Center table -->
  <polygon points="48,42 78,42 63,52" fill="#f2dcff"/>
  <!-- Center-right upper -->
  <polygon points="78,42 76,62 63,52" fill="#cc90e8"/>
  <!-- Right bezel -->
  <polygon points="78,42 80,62 89,62 92,42" fill="#b870d8"/>
  <!-- Far right bezel -->
  <polygon points="92,42 89,62 104,62 104,52" fill="#9050be"/>

  <!-- Top crown facets -->
  <!-- Top-left -->
  <polygon points="22,52 34,42 48,30 50,42" fill="#ddb0f0"/>
  <!-- Top-center -->
  <polygon points="48,30 78,30 92,42 48,42" fill="#f0d0ff"/>
  <!-- Top-right -->
  <polygon points="78,30 92,42 104,52 80,42" fill="#aa68cc"/>

  <!-- Table (flat top face) -->
  <polygon points="48,30 78,30 88,40 38,40" fill="#f8e8ff"/>

  <!-- === HIGHLIGHTS === -->
  <!-- Bright sheen across table -->
  <polygon points="50,31 76,31 82,38 46,38" fill="white" opacity="0.40"/>
  <!-- Left crown light -->
  <polygon points="34,42 48,42 50,62 37,62" fill="white" opacity="0.10"/>
  <!-- Inner glow on table-to-crown -->
  <polygon points="52,32 74,32 76,40 50,40" fill="white" opacity="0.20"/>

  <!-- Sparkle cross top-right of gem -->
  <line x1="92" y1="26" x2="92" y2="34" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.90"/>
  <line x1="88" y1="30" x2="96" y2="30" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.90"/>
  <circle cx="99" cy="38" r="1.8" fill="white" opacity="0.70"/>
  <circle cx="85" cy="22" r="1.2" fill="white" opacity="0.55"/>
</svg>
